# Canary: a Kubernetes workload that violates most of kubescape's allcontrols.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: canary
spec:
  replicas: 1
  selector:
    matchLabels:
      app: canary
  template:
    metadata:
      labels:
        app: canary
    spec:
      hostNetwork: true
      hostPID: true
      hostIPC: true
      containers:
        - name: canary
          image: nginx:latest
          securityContext:
            privileged: true
            runAsUser: 0
            allowPrivilegeEscalation: true
            readOnlyRootFilesystem: false
          ports:
            - containerPort: 80
