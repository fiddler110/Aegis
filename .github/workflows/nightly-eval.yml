name: Nightly Live-Model Eval

# Runs the live-model eval tier (internal/eval's live_eval-tagged scenarios)
# against a real local model. This is deliberately separate from ci.yml: it
# needs a pulled model and several minutes of inference time, neither of
# which belong gating every push/PR the way build+test+vet do.
#
# Schedule trigger disabled — was firing (and failing) on every push because
# an earlier fully-commented-out version of this file was invalid YAML.
# Kept as workflow_dispatch-only so it can still be run manually.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-eval:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      # A *thinking* model, deliberately (EXEC-6). The tier's whole purpose is
      # to exercise the population the local profile targets, and that
      # population reasons before it answers — the previous default (llama3.2)
      # did not, which is half of why an output-guard defect that only
      # manifests on a reasoning model survived this workflow entirely. The
      # other half was that the tier built an openai-compat adapter while
      # production ships the native one; it now goes through
      # providerfactory.Build (see liveAdapter).
      #
      # Size is still a CI-runtime tradeoff: the same model both answers the
      # prompt and judges its own answer against the rubric (ExpectRubric
      # reuses Options.Adapter/Model), so too small a tag risks flaky failures
      # from a weak judge rather than a real regression. Override locally via
      # the same env var.
      AEGIS_EVAL_MODEL: "qwen3:8b"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      - name: Install Ollama
        run: curl -fsSL https://ollama.com/install.sh | sh

      - name: Start Ollama
        run: |
          ollama serve &
          for i in $(seq 1 30); do
            curl -sf http://localhost:11434/api/tags >/dev/null && break
            sleep 1
          done

      - name: Pull eval model
        run: ollama pull "${AEGIS_EVAL_MODEL}"

      - name: Run live eval
        run: go test -tags live_eval ./internal/eval/... -run TestLiveModelQuality -v -timeout 45m
